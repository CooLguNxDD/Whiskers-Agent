# Development compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up whiskers-agent
services:
  whiskers-agent:
    command: python whiskers_agent_mcp.py --transport http --host 0.0.0.0 --port ${MCP_PORT:-10000}
    volumes:
      - .:/app
    ports:
      - "${MCP_PORT:-10000}:${MCP_PORT:-10000}"
    networks:
      - whiskers-network
    environment:
      # Ensure WS URLs (terminal/analytics) built for browser-reachable address.
      # localhost here is interpreted by the browser on the Docker host.
      MCP_SERVER_URL: http://localhost:${MCP_PORT:-10000}
      CAT_ALLOW_LOCAL_PROXIES: "1"
      # NOTE: MCP_CORS_* is deliberately NOT set here. Compose `environment:`
      # overrides `env_file:`, so pinning it would silently defeat the .env
      # allowlist for every developer. Relaxed CORS (reflect any Origin WITH
      # credentials) is opt-in per run, e.g. for a session-scoped ngrok hostname:
      #   MCP_CORS_RELAXED=1 docker compose -f docker-compose.yml -f docker-compose.dev.yml up
      # It does NOT bypass Chrome Private Network Access — public pages still
      # cannot call http://localhost; use a same-origin proxy or a public tunnel.

    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-1}
        INSTALL_AGY: ${INSTALL_AGY:-1}
        INSTALL_GROK: ${INSTALL_GROK:-1}
      cache_from: []

    stdin_open: true
    tty: true
    restart: no

  cat-admin-frontend:
    image: whiskers-frontend:dev
    build:
      context: ./frontend/cat-admin-frontend
      dockerfile: Dockerfile.dev
      cache_from: []
    container_name: whiskers-frontend
    ports: !override
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: http://whiskers-agent:${MCP_PORT:-10000}
      MCP_SERVER_URL: http://whiskers-agent:${MCP_PORT:-10000}

      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "5000"
    volumes:
      - ./frontend/cat-admin-frontend:/app
      - /app/node_modules
      - ./frontend/cat-admin-frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - whiskers-network
    # Override healthcheck for dev server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stdin_open: true
    tty: true
    restart: no

  minio:
    ports: !override
      - "10001:9000"
      - "10002:9001"

networks:
  whiskers-network:
    driver: bridge
