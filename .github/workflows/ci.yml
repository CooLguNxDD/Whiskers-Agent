# Backend CI: lint (warn-first) + unit tests against an isolated Postgres.
# Ruff/mypy start non-gating so the existing backlog cannot block merges;
# flip continue-on-error off once the module sweeps land.
name: CI

on:
  push:
    branches: [main, master, new_agent_flow]
  pull_request:
    branches: [main, master, new_agent_flow]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # 32-byte base64 MASTER_KEY for pgcrypto tests (not a production secret).
  MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  OAUTH_ENABLED: "false"
  ENV: "dev"
  PLUGIN_API_URL: "https://test.api.example.com"
  DEFAULT_PROJECT_ID: "1"

jobs:
  lint:
    name: Lint (ruff + mypy scoped)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML types-requests

      - name: Ruff bare-except gate (E722,S110,S112) repo-wide
        # Silent except/pass/continue must stay at zero after the C1 sweep.
        run: |
          ruff check . --select E722,S110,S112 --output-format=github
          echo "::notice::ruff E722/S110/S112 gate clean"

      - name: Ruff (full tree, warn mode)
        # Other ruff rules stay warn-first until the broader backlog is clean.
        continue-on-error: true
        run: |
          ruff check . --output-format=github
          echo "::notice::ruff full-tree finished (warn mode for non-gate rules)"

      - name: Ruff bare-except ratchet on changed files
        # Second gate: same codes on files touched in this PR/push.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "${BASE}" ]; then
            echo "No base ref; skipping changed-file ratchet."
            exit 0
          fi
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.py' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Python files changed."
            exit 0
          fi
          echo "Ratchet on ${#FILES[@]} file(s):"
          printf '  %s\n' "${FILES[@]}"
          ruff check --select E722,S110,S112 "${FILES[@]}"

      - name: Mypy (api/ + core_graph/ only, warn mode)
        # Warn-first until the scoped backlog is clean enough to gate merges.
        continue-on-error: true
        run: |
          mypy api core_graph --ignore-missing-imports
          echo "::notice::mypy scoped to api/ + core_graph/ (warn mode)"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: whiskers
          POSTGRES_PASSWORD: whiskers
          POSTGRES_DB: whiskers_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whiskers -d whiskers_mcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://whiskers:whiskers@localhost:5432/whiskers_mcp_test
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: System deps (cairosvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scaffold config/*.json from examples
        # config/*.json is gitignored (host-local), so a fresh CI checkout has
        # none of it — utils.config_registry._load_json silently returns {}
        # for each missing file, and code with no built-in fallback (e.g. the
        # ListSessions response-shape projection) then no-ops instead of
        # erroring. Seed the same *_example.json -> real-name copy that
        # terminal/script/setup.py does for a first-time local setup.
        run: |
          python -c "from pathlib import Path; from terminal.script.setup import scaffold_config_files; print('Scaffolded:', scaffold_config_files(Path('config')))"

      - name: Alembic migrate test DB
        run: |
          alembic upgrade heads

      - name: Apply plugin-local schema migrations
        # Plugin DDL (portfolio_projects, ...) is normally applied by
        # PluginLifecycleManager during app boot, which CI never runs.
        # Drive the same PluginSchemaMigrator entrypoint standalone so
        # plugin-owned tables exist before plugin tests hit them.
        run: |
          python scripts/apply_plugin_migrations.py

      - name: Run unit tests
        run: |
          # Prefer the project runner so DB isolation rules stay centralized.
          # Inside GHA there is no whiskers-agent-server container, so the host
          # path of scripts/run_tests.py runs pytest in-process.
          python scripts/run_tests.py test/unit plugins -q --tb=line
