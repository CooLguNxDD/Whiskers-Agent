# Local Pullfrog (no pullfrog.com dashboard)
# Orchestration is entirely GitHub Actions + this config.

mention: "@pullfrog"
runner_labels: ubuntu-latest
agent: opencode
model: openrouter/meta/muse-spark-1.3-contributor

# Official Pullfrog Agent Image
image:
  repository: ghcr.io/coolgunxdd/pullfrog-agent:latest
  tag: latest

action:
  uses: CooLguNxDD/pullfrog-lemon-custom-build@main

features:
  dispatch: true
  # Explicit @pullfrog in issue/PR comments only.
  mention_triggers: true
  pr_review:
    enabled: true
    # Review setup: low (40 calls), high (100), max (200; default).
    # PULLFROG_REVIEW_BUDGET overrides this for all code review entrypoints.
    # Unset variable uses this value; invalid selected values fall back to max.
    budget: max
    include_drafts: false
    on_synchronize: false
  issues:
    enabled: true
    mode: plan # plan | build

  # Auto-address / CI-fix can push commits. Gate with only_bot_prs.
  address_reviews:
    enabled: true
    only_bot_prs: true
  ci_fix:
    enabled: true
    only_bot_prs: true

status_checks: false

