services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: whiskers-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whiskers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whiskers}
      POSTGRES_DB: ${POSTGRES_DB:-whiskers_mcp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - whiskers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whiskers} -d ${POSTGRES_DB:-whiskers_mcp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
        reservations:
          cpus: '0.5'
          memory: 256M

  minio:
    image: minio/minio
    container_name: whiskers-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - whiskers-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  whiskers-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-1}
        INSTALL_AGY: ${INSTALL_AGY:-1}
        INSTALL_GROK: ${INSTALL_GROK:-1}
    container_name: whiskers-agent-server
    ports:
      - "${MCP_PORT:-10000}:${MCP_PORT:-10000}"
    env_file:
      - .env
    environment:
      # OAuth (if USERNAME/PASSWORD are empty)
      OAUTH_ENABLED: ${OAUTH_ENABLED:-}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://localhost:10000}
      
      # LLM Provider configuration (for run_graph tool)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

      # Local LLM & Embedding endpoint configuration (LM Studio)
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_PROFILE: ${EMBED_PROFILE:-}

      # Claude Code CLI (LLM_PROVIDER=claude-cli / GoapAgent_run_cli_agent)
      # Generate a long-lived token on a trusted host: `claude setup-token`
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_CLI_BINARY: ${CLAUDE_CLI_BINARY:-claude}
      CLI_AGENT_PROVIDER: ${CLI_AGENT_PROVIDER:-claude}
      DISABLE_AUTOUPDATER: ${DISABLE_AUTOUPDATER:-1}
      
      # xAI Grok CLI auth
      GROK_AUTH_JSON: ${GROK_AUTH_JSON:-}
      
      # Run headless CLI as non-root so --dangerously-skip-permissions works
      CLI_AGENT_USER: ${CLI_AGENT_USER:-whiskers-claude}
      CLI_AGENT_DROP_PRIVS: ${CLI_AGENT_DROP_PRIVS:-1}

      # Database (psycopg 3 async driver — required for ORM embedding operations)
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://whiskers:whiskers@postgres:5432/whiskers_mcp}

      # Global Context
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Python settings
      PYTHONUNBUFFERED: "1"

      # MinIO configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-job-search-resumes}


    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      # Optional: mount local code for development (disabled in production)
      - .:/app
      # Docker socket: lets the setup TUI restart this container from inside itself
      # (scripts/setup.py::run_restart via docker-py). SECURITY: grants this container
      # full host-Docker control (container-escape-equivalent). Single-operator/dev only.
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - whiskers-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Restart policy
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; r=requests.get('http://localhost:${MCP_PORT:-10000}/api/admin/public/exists', timeout=5); r.raise_for_status()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
        reservations:
          cpus: '0.5'
          memory: 256M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whiskers-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@whiskers-agent.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whiskers-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
        reservations:
          cpus: '0.5'
          memory: 256M

  cat-admin-frontend:
    image: whiskers-frontend:prod
    build:
      context: ./frontend/cat-admin-frontend
      dockerfile: Dockerfile
    container_name: whiskers-frontend
    ports:
      # Production image serves nginx on port 8080 as a non-root user.
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      whiskers-agent:
        condition: service_healthy
    networks:
      - whiskers-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://host.docker.internal:10000}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://host.docker.internal:10000}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - ./frontend/cat-admin-frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  whiskers-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
